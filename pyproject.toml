[project]
name = "etl-bench"
version = "0.1.0"
description = "Full reload vs windowed vs incremental ETL from SQL Server to PostgreSQL, benchmarked for speed, storage and correctness."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "psycopg[binary]>=3.2",
    "pymssql>=2.3",
]

[project.scripts]
etl-bench = "etl_bench.bench:main"

[dependency-groups]
dev = [
    "pre-commit>=3.7",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/etl_bench"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
